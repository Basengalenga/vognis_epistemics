[project]
name = "vognis-prototipo"
version = "0.1.0"
description = "Vognis: The Serendipity Workspace - Backend Prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic[bedrock]>=0.40.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]
